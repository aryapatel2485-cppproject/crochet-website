<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crochet Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f8f8f8;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    #dashboard {
      display: none;
    }

    .product {
      border-top: 1px solid #ddd;
      padding: 20px 0;
    }

    .product img {
      max-width: 180px;
      max-height: 180px;
      display: block;
      margin: 10px 0;
      border-radius: 8px;
      object-fit: cover;
    }

    .file-label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    #imagePreview {
      max-width: 200px;
      max-height: 200px;
      display: none;
      margin: 10px 0 15px 0;
      border-radius: 8px;
      object-fit: cover;
    }

    .message {
      font-weight: bold;
    }

    .delete-button {
      width: auto;
      padding: 10px 20px;
      margin-top: 10px;
    }

  </style>
</head>


<body>


  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="login" class="card">

    <h1>Admin Login</h1>

    <p>
      Log in to manage products.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Log In
    </button>

    <p
      id="loginMessage"
      class="message">
    </p>

  </div>



  <!-- ========================= -->
  <!-- DASHBOARD -->
  <!-- ========================= -->

  <div id="dashboard" class="card">

    <h1>Product Dashboard 🧶</h1>

    <button onclick="logout()">
      Log Out
    </button>


    <!-- ADD PRODUCT -->

    <h2>Add a Product</h2>


    <input
      id="name"
      placeholder="Product name"
    >


    <textarea
      id="description"
      placeholder="Product description"
    ></textarea>


    <input
      id="price"
      type="number"
      step="0.01"
      placeholder="Price"
    >


    <label
      class="file-label"
      for="productImage">

      Product Image 📷

    </label>


    <input
      id="productImage"
      type="file"
      accept="image/*"
      onchange="previewImage()"
    >


    <!-- IMAGE PREVIEW -->

    <img
      id="imagePreview"
      alt="Image preview"
    >


    <button onclick="addProduct()">
      Add Product
    </button>


    <p
      id="productMessage"
      class="message">
    </p>



    <!-- PRODUCTS -->

    <h2>Your Products</h2>

    <div id="products"></div>

  </div>



  <script>


    // =========================================
    // SUPABASE CONNECTION
    // =========================================

    const SUPABASE_URL =
      "https://apimgrrrjiktfubytirp.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_mgSwSTHD32wS8g-365P9mQ_60azcTdy";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    // =========================================
    // LOGIN
    // =========================================

    async function login() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const { error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        document
          .getElementById("loginMessage")
          .textContent =
          "Login error: " + error.message;

      }

      else {

        document
          .getElementById("loginMessage")
          .textContent = "";

        showDashboard();

      }

    }



    // =========================================
    // LOG OUT
    // =========================================

    async function logout() {

      await supabaseClient.auth.signOut();


      document
        .getElementById("dashboard")
        .style.display = "none";


      document
        .getElementById("login")
        .style.display = "block";

    }



    // =========================================
    // SHOW DASHBOARD
    // =========================================

    async function showDashboard() {

      document
        .getElementById("login")
        .style.display = "none";


      document
        .getElementById("dashboard")
        .style.display = "block";


      loadProducts();

    }



    // =========================================
    // IMAGE PREVIEW
    // =========================================

    function previewImage() {

      const file =
        document
          .getElementById("productImage")
          .files[0];


      const preview =
        document
          .getElementById("imagePreview");


      if (!file) {

        preview.src = "";

        preview.style.display = "none";

        return;

      }


      preview.src =
        URL.createObjectURL(file);


      preview.style.display = "block";

    }



    // =========================================
    // ADD PRODUCT
    // =========================================

    async function addProduct() {

      const message =
        document
          .getElementById("productMessage");


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const price =
        Number(
          document
            .getElementById("price")
            .value
        );


      const imageFile =
        document
          .getElementById("productImage")
          .files[0];


      // Check fields

      if (
        !name ||
        !description ||
        !price ||
        !imageFile
      ) {

        message.textContent =
          "Please fill in all fields and choose an image.";

        return;

      }


      // Check image type

      if (!imageFile.type.startsWith("image/")) {

        message.textContent =
          "Please choose an image file.";

        return;

      }


      message.textContent =
        "Uploading image... 📷";


      try {


        // =====================================
        // CREATE UNIQUE FILE NAME
        // =====================================

        const fileExtension =
          imageFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2) +
          "." +
          fileExtension;



        // =====================================
        // UPLOAD IMAGE
        // =====================================

        const { error: uploadError } =
          await supabaseClient
            .storage
            .from("product-images")
            .upload(
              fileName,
              imageFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          throw uploadError;

        }



        message.textContent =
          "Image uploaded! Saving product... ☁️";



        // =====================================
        // GET IMAGE URL
        // =====================================

        const { data: publicUrlData } =
          supabaseClient
            .storage
            .from("product-images")
            .getPublicUrl(fileName);


        const imageUrl =
          publicUrlData.publicUrl;



        // =====================================
        // SAVE PRODUCT
        // =====================================

        const { error: productError } =
          await supabaseClient
            .from("products")
            .insert([

              {
                name: name,

                description: description,

                price: price,

                image_url: imageUrl
              }

            ]);


        if (productError) {

          throw productError;

        }



        // =====================================
        // SUCCESS
        // =====================================

        message.textContent =
          "Product added successfully! 🎉";


        // Clear fields

        document
          .getElementById("name")
          .value = "";


        document
          .getElementById("description")
          .value = "";


        document
          .getElementById("price")
          .value = "";


        document
          .getElementById("productImage")
          .value = "";


        const preview =
          document
            .getElementById("imagePreview");


        preview.src = "";

        preview.style.display = "none";


        // Reload products

        loadProducts();

      }


      catch (error) {

        console.error(error);


        message.textContent =
          "Error: " + error.message;

      }

    }



    // =========================================
    // LOAD PRODUCTS
    // =========================================

    async function loadProducts() {

      const container =
        document
          .getElementById("products");


      const { data, error } =
        await supabaseClient
          .from("products")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        container.textContent =
          "Could not load products: " +
          error.message;

        return;

      }


      if (!data || data.length === 0) {

        container.innerHTML =
          "<p>No products yet.</p>";

        return;

      }



      container.innerHTML =

        data.map(product => `

          <div class="product">

            <strong>
              ${escapeHTML(product.name)}
            </strong>

            —
            $${Number(product.price).toFixed(2)}

            <p>
              ${escapeHTML(
                product.description || ""
              )}
            </p>


            ${
              product.image_url

              ? `

                <img
                  src="${product.image_url}"
                  alt="${escapeHTML(
                    product.name
                  )}"
                >

              `

              : ""

            }


            <button
              class="delete-button"
              onclick="deleteProduct(
                '${product.id}',
                '${encodeURIComponent(
                  product.image_url || ""
                )}'
              )">

              🗑️ Delete Product

            </button>

          </div>

        `).join("");

    }



    // =========================================
    // DELETE PRODUCT
    // =========================================

    async function deleteProduct(
      productId,
      encodedImageUrl
    ) {


      const confirmed =
        confirm(
          "Are you sure you want to delete this product?"
        );


      if (!confirmed) {

        return;

      }


      const message =
        document
          .getElementById("productMessage");


      message.textContent =
        "Deleting product...";



      try {


        const imageUrl =
          decodeURIComponent(
            encodedImageUrl
          );



        // =====================================
        // DELETE IMAGE FIRST
        // =====================================

        if (imageUrl) {


          const marker =
            "/product-images/";


          const markerPosition =
            imageUrl.indexOf(marker);


          if (markerPosition !== -1) {


            const fileName =
              decodeURIComponent(
                imageUrl.substring(
                  markerPosition + marker.length
                )
              );


            const { error: imageError } =
              await supabaseClient
                .storage
                .from("product-images")
                .remove([
                  fileName
                ]);


            if (imageError) {

              throw imageError;

            }

          }

        }



        // =====================================
        // DELETE PRODUCT FROM DATABASE
        // =====================================

        const { error: productError } =
          await supabaseClient
            .from("products")
            .delete()
            .eq(
              "id",
              productId
            );


        if (productError) {

          throw productError;

        }



        message.textContent =
          "Product deleted successfully! 🗑️";


        loadProducts();

      }


      catch (error) {

        console.error(error);


        message.textContent =
          "Could not delete product: " +
          error.message;

      }

    }



    // =========================================
    // ESCAPE HTML
    // =========================================

    function escapeHTML(value) {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }



    // =========================================
    // CHECK LOGIN
    // =========================================

    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient
          .auth
          .getSession();


      if (session) {

        showDashboard();

      }

    }


    checkLogin();

  </script>

</body>
</html>
