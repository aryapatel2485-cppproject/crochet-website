<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f8f8f8;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    button {
      cursor: pointer;
      font-weight: bold;
    }
    #dashboard { display: none; }
    .product {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }
    .product img {
      max-width: 120px;
      max-height: 120px;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <div id="login" class="card">
    <h1>Admin Login</h1>
    <p>Log in to manage products.</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Log In</button>
    <p id="loginMessage"></p>
  </div>

  <div id="dashboard" class="card">
    <h1>Product Dashboard 🧶</h1>
    <button onclick="logout()">Log Out</button>

    <h2>Add a Product</h2>
    <input id="name" placeholder="Product name">
    <textarea id="description" placeholder="Product description"></textarea>
    <input id="price" type="number" step="0.01" placeholder="Price">
    <input id="imageUrl" placeholder="Image URL">
    <button onclick="addProduct()">Add Product</button>
    <p id="productMessage"></p>

    <h2>Your Products</h2>
    <div id="products"></div>
  </div>

  <script>
    // Replace these two values with your Supabase information
    const SUPABASE_URL = "https://apimgrrrjiktfubytirp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mgSwSTHD32wS8g-365P9mQ_60azcTdy";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        document.getElementById("loginMessage").textContent = error.message;
      } else {
        showDashboard();
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("login").style.display = "block";
    }

    async function showDashboard() {
      document.getElementById("login").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadProducts();
    }

    async function addProduct() {
      const name = document.getElementById("name").value;
      const description = document.getElementById("description").value;
      const price = Number(document.getElementById("price").value);
      const image_url = document.getElementById("imageUrl").value;

      const { error } = await supabaseClient
        .from("products")
        .insert([{ name, description, price, image_url }]);

      const message = document.getElementById("productMessage");

      if (error) {
        message.textContent = "Error: " + error.message;
      } else {
        message.textContent = "Product added successfully! 🎉";
        document.getElementById("name").value = "";
        document.getElementById("description").value = "";
        document.getElementById("price").value = "";
        document.getElementById("imageUrl").value = "";
        loadProducts();
      }
    }

    async function loadProducts() {
      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

      const container = document.getElementById("products");

      if (error) {
        container.textContent = "Could not load products: " + error.message;
        return;
      }

      container.innerHTML = data.map(product => `
        <div class="product">
          <strong>${product.name}</strong> — $${product.price}
          <p>${product.description || ""}</p>
          ${product.image_url ? `<img src="${product.image_url}" alt="${product.name}">` : ""}
        </div>
      `).join("");
    }

    async function checkLogin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) showDashboard();
    }

    checkLogin();
  </script>

</body>
</html>
